services:
  chat:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=8001
      - APP_URL=${APP_URL:-https://chat.tdshift.info}
      - AUTH_BASE_URL=${AUTH_BASE_URL:-https://auth.tdshift.info}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-chat-ai}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:?set OAUTH_CLIENT_SECRET in chat/.env}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-https://chat.tdshift.info/auth/callback}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in chat/.env}
      - DATABASE_PATH=/data/chat.db
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      - OPENROUTER_SITE_URL=${OPENROUTER_SITE_URL:-https://chat.tdshift.info}
      - OPENROUTER_APP_NAME=${OPENROUTER_APP_NAME:-TDShift Chat AI}
    ports:
      - "8001:8001"
    volumes:
      - chat-data:/data
    restart: unless-stopped

volumes:
  chat-data:
